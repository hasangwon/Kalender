name: PlanWidget
options:
  bundleIdPrefix: com.hasangwon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    DEVELOPMENT_TEAM: TWTRVUW4YN
    # Xcode 권장 설정 반영 (Update to recommended settings 알림 제거)
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  PlanWidget:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hasangwon.planwidget
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    sources:
      - App/Sources
      - App/Resources
      - Shared/Sources
      - path: PlanWidget.storekit
        buildPhase: none
    entitlements:
      path: App/PlanWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hasangwon.planwidget]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.hasangwon.planwidget]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kalender
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [remote-notification]
        NSCalendarsFullAccessUsageDescription: "애플 기본 달력의 일정을 Kalender에 함께 보여주기 위해 달력 접근이 필요합니다. (읽기 전용)"
    dependencies:
      - target: PlanWidgetExtension
        embed: true
  PlanWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - Widget/Sources
      - Shared/Sources
    entitlements:
      path: Widget/PlanWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hasangwon.planwidget]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.hasangwon.planwidget]
        com.apple.developer.icloud-services: [CloudKit]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Kalender
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hasangwon.planwidget.widget

schemes:
  PlanWidget:
    build:
      targets:
        PlanWidget: all
    run:
      config: Debug
      storeKitConfiguration: PlanWidget.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
